name: CI

on:
  pull_request:
  push:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.14.0
          - 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm -w audit:prod
      - name: Audit development dependencies
        run: pnpm -w audit:dev
      - name: Validate workspace
        run: pnpm -w validate:ci

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: primitives-chromium
            browser: chromium
          - project: primitives-firefox
            browser: firefox
          - project: primitives-webkit
            browser: webkit
          - project: astro-chromium
            browser: chromium
          - project: astro-firefox
            browser: firefox
          - project: astro-webkit
            browser: webkit
          - project: svelte-chromium
            browser: chromium
          - project: svelte-firefox
            browser: firefox
          - project: svelte-webkit
            browser: webkit
          - project: visual-astro-chromium
            browser: chromium
          - project: visual-svelte-chromium
            browser: chromium
          - project: stress-astro-chromium
            browser: chromium
          - project: stress-svelte-chromium
            browser: chromium
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Build E2E fixtures
        run: pnpm test:e2e:prepare
      - name: Run ${{ matrix.project }}
        run: pnpm exec playwright test --project=${{ matrix.project }}
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
